# General
$filemanager = dolphin
$applauncher = wofi
$terminal = kitty
$idlehandler = swayidle -w timeout 300 'swaylock -f -c 000000' before-sleep 'swaylock -f -c 000000'

# Screenshots
$shotRegion = grimblast copy area
$shotWindow = grimblast copy active
$shotScreen = grimblast copy output

# Input wiki https://wiki.hyprland.org/Configuring/Variables/#input

input {
    follow_mouse = 2 # 0|1|2|3
    float_switch_override_focus = 2
    kb_layout = us,am,ru
    kb_variant =  ,phonetic,typewriter
    kb_options = caps:escape
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = -1
}
